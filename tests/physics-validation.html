<body class="sim-body">
<div id="wrap">
  <h1>Physics validation</h1>
  <p class="hint">
    Analytic oracles run against the production <code>GPUPhysics</code>, headless, on this
    browser's WebGPU device. Each row states the number the physics predicts and the number
    the simulation produced. Run it in an installed, headed Chrome.
  </p>
  <div class="actions">
    <button id="runBtn" class="tool-btn">Run</button>
    <span id="status" class="hint">Idle.</span>
  </div>
  <table>
    <thead><tr><th>Status</th><th>Case</th><th>Expected</th><th>Measured</th><th>Metric</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="log"></div>
</div>

<script type="module">
import GPUPhysics from './src/gpu/gpu-physics.js';
import { PION_SIZE, PARTICLE_STATE_SIZE } from './src/gpu/gpu-buffers.js';
import {
    PION_HALF_LIFE, CHARGED_PION_HALF_LIFE, MIN_MASS, BOSON_CHARGE,
    SHEET_THICKNESS, SHEET_THICKNESS_SQ, SOFTENING_SQ, BOUND_LOOP, GPU_SCALAR_GRID, PHYSICS_DT,
    WORLDLINE_LEN, WORLDLINE_DT, INERTIA_K,
} from './src/config.js';
import { WL_STRIDE } from './src/gpu/gpu-constants.js';
import { TOGGLE_KEYS } from './src/physics-contract.js';

const rowsEl = document.getElementById('rows');
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const fmt = (v, d = 4) => (typeof v === 'number' && isFinite(v)) ? v.toPrecision(d) : String(v);

function logln(text) {
    logEl.textContent += text + '\n';
    logEl.scrollTop = logEl.scrollHeight;
}

// ── Harness ──

let _device = null;
async function getDevice() {
    if (_device) return _device;
    if (!navigator.gpu) throw new Error('WebGPU unavailable');
    const adapter = await navigator.gpu.requestAdapter();
    _device = await adapter.requestDevice({
        requiredLimits: {
            maxStorageBufferBindingSize: 256 * 1024 * 1024,
            maxBufferSize: 256 * 1024 * 1024,
            maxComputeWorkgroupsPerDimension: 65535,
            maxStorageBuffersPerShaderStage: Math.min(adapter.limits.maxStorageBuffersPerShaderStage, 10),
            maxBindingsPerBindGroup: adapter.limits.maxBindingsPerBindGroup,
        },
    });
    _device.addEventListener('uncapturederror', (e) => logln('GPU error: ' + e.error.message));
    return _device;
}

/** A physics-store stand-in: every toggle off, default parameters, overrides on top. */
function physicsWith(on = [], params = {}) {
    const p = {
        yukawaMu: 0.15, higgsMass: 0.5, axionMass: 0.05, hubbleParam: 0.001,
        extGravity: 0, extGravityAngle: 0, extElectric: 0, extElectricAngle: 0, extBz: 0,
        bounceFriction: 0.4, collisionMode: 0, yukawaCoupling: 14,
    };
    for (const k of TOGGLE_KEYS) p[k] = false;
    for (const k of on) p[k] = true;
    return Object.assign(p, params);
}

async function makeSim({ on = [], params = {}, domainW = 64, domainH = 48, boundary = 0 } = {}) {
    const device = await getDevice();
    const gp = new GPUPhysics(device, domainW, domainH);
    await gp.init();
    gp.boundaryMode = boundary;
    gp.setToggles(physicsWith(on, params));
    if (on.some(k => ['higgsEnabled', 'axionEnabled', 'blackHoleEnabled'].includes(k))) {
        await gp._ensurePhase5Pipelines();
    }
    return gp;
}

async function readBuffer(gp, buf, bytes) {
    const staging = gp.device.createBuffer({ size: bytes, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const enc = gp.device.createCommandEncoder();
    enc.copyBufferToBuffer(buf, 0, staging, 0, bytes);
    gp.device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ);
    const out = staging.getMappedRange().slice(0);
    staging.unmap();
    staging.destroy();
    return out;
}

async function readParticles(gp) {
    const raw = await readBuffer(gp, gp.buffers.particleState, gp.aliveCount * PARTICLE_STATE_SIZE);
    const f = new Float32Array(raw), u = new Uint32Array(raw);
    const out = [];
    for (let i = 0; i < gp.aliveCount; i++) {
        const b = i * 9;
        out.push({ x: f[b], y: f[b + 1], wx: f[b + 2], wy: f[b + 3], mass: f[b + 4], alive: (u[b + 8] & 1) !== 0 });
    }
    return out;
}

/** Write pions straight into the pool: [{x, y, wx, wy, mass, charge}]. */
function addPions(gp, list) {
    const buf = new ArrayBuffer(list.length * PION_SIZE);
    const f = new Float32Array(buf), u = new Uint32Array(buf);
    list.forEach((p, i) => {
        const b = i * 12;
        f[b] = p.x; f[b + 1] = p.y; f[b + 2] = p.wx; f[b + 3] = p.wy;
        f[b + 4] = p.mass; f[b + 5] = p.charge; f[b + 6] = 0;
        u[b + 7] = 0xFFFFFFFF; u[b + 8] = 100; u[b + 9] = 1; u[b + 10] = 0; u[b + 11] = 0;
    });
    gp.device.queue.writeBuffer(gp.buffers.pionPool, 0, buf);
    gp.device.queue.writeBuffer(gp.buffers.piCount, 0, new Uint32Array([list.length]));
}

async function countAlivePions(gp, n) {
    const raw = await readBuffer(gp, gp.buffers.pionPool, n * PION_SIZE);
    const u = new Uint32Array(raw);
    let alive = 0;
    for (let i = 0; i < n; i++) if ((u[i * 12 + 9] & 1) && u[i * 12 + 10] === 0) alive++;
    return alive;
}

/** Clocks of the first n slots: [{tau, phase, theta, lapse}]. */
async function readClocks(gp, n) {
    const f = new Float32Array(await readBuffer(gp, gp.buffers.clocks, n * 16));
    return Array.from({ length: n }, (_, i) => ({ tau: f[i * 4], phase: f[i * 4 + 1], theta: f[i * 4 + 2], lapse: f[i * 4 + 3] }));
}

/** Relativistic circular-orbit speed under the softened central force k·r/(r²+ε²)^{3/2} on mass m. */
function vCircRel(k, r, m) {
    const rSq = r * r + SOFTENING_SQ;
    const s = Math.abs(k) * r * r / (m * rSq * Math.sqrt(rSq));
    return Math.sqrt((-s * s + Math.sqrt(s ** 4 + 4 * s * s)) / 2);
}

/**
 * Run one lab-time orbital period, tracking slot idx's spoke angle θ unwrapped.
 * Returns the net change of θ.
 */
async function precessionOverOrbit(gp, idx, period, dt, samples = 40) {
    const frames = Math.round(period / dt);
    const every = Math.max(1, Math.floor(frames / samples));
    let theta = (await readClocks(gp, idx + 1))[idx].theta;
    let total = 0;
    for (let i = 0; i < frames; i++) {
        gp.update(dt);
        if ((i + 1) % every === 0 || i === frames - 1) {
            const next = (await readClocks(gp, idx + 1))[idx].theta;
            let d = next - theta;
            d -= 2 * Math.PI * Math.round(d / (2 * Math.PI));
            total += d;
            theta = next;
        }
    }
    return total;
}

/** Advance lab time T in frames of dt. */
async function run(gp, T, dt) {
    const frames = Math.round(T / dt);
    for (let i = 0; i < frames; i++) {
        gp.update(dt);
        if ((i & 63) === 63) await gp.device.queue.onSubmittedWorkDone();
    }
    await gp.device.queue.onSubmittedWorkDone();
}

// ── Cases ──
// Each returns { expected, measured, metric, pass }.

const cases = [];

// Regression: the field-gravity FFT ran every butterfly stage with the last
// stage's parameters and returned Φ ≡ 0. Check the particles' Φ_P against a
// direct circular convolution of the same deposited mass grid.
cases.push({
    name: 'Grid gravity: FFT Φ_P = direct sheet convolution',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'higgsEnabled'] });
        gp.addParticle({ x: 20, y: 20, mass: 5 });
        gp.addParticle({ x: 41.3, y: 30.2, mass: 8 });
        gp.addParticle({ x: 50, y: 9.7, mass: 3 });
        await run(gp, 2 * PHYSICS_DT, PHYSICS_DT);
        const N = GPU_SCALAR_GRID, n2 = N * N;
        const g = gp._gravGrid;
        const mass = new Float32Array(await readBuffer(gp, g.massGrid, n2 * 4));
        const phiP = new Float32Array(await readBuffer(gp, g.phiP, n2 * 4));
        const cw = gp.domainW / N, ch = gp.domainH / N;
        const src = [];
        for (let i = 0; i < n2; i++) if (mass[i] !== 0) src.push([i % N, Math.floor(i / N), mass[i]]);
        let maxErr = 0, maxPhi = 0;
        for (let iy = 0; iy < N; iy += 3) for (let ix = 0; ix < N; ix += 3) {
            let s = 0;
            for (const [sx, sy, m] of src) {
                let dx = ((ix - sx) % N + N) % N, dy = ((iy - sy) % N + N) % N;
                if (dx > N / 2) dx -= N;
                if (dy > N / 2) dy -= N;
                s -= m / Math.sqrt((dx * cw) ** 2 + (dy * ch) ** 2 + SHEET_THICKNESS_SQ);
            }
            maxErr = Math.max(maxErr, Math.abs(s - phiP[iy * N + ix]));
            maxPhi = Math.max(maxPhi, Math.abs(s));
        }
        gp.destroy();
        const rel = maxErr / maxPhi;
        return { expected: `max |Φ| ${fmt(maxPhi)}`, measured: `max err ${fmt(maxErr, 3)}`,
                 metric: `rel ${fmt(rel, 2)}`, pass: maxPhi > 0.5 && rel < 1e-4 };
    },
});

// The fields evolve in ds² = −e^{2Φ}dt² + e^{−2Φ}d𝐱², so a uniform axion field
// oscillates at ω = e^{Φ}m_a: a field clock runs slow in a well. Released from
// rest, it first crosses zero at t₀ = π/(2ω), so the deep probe (on the mass)
// and the far one (the opposite corner of the torus) cross in the ratio
// e^{Φ_far − Φ_deep}. The amplitude is small so the field's own gravity is
// negligible next to the particle's.
cases.push({
    name: 'Field clocks redshift: axion ω = e^{Φ}m_a near a mass',
    async run() {
        const mA = 2;   // heavy, so gradient coupling between regions stays small
        const gp = await makeSim({ on: ['gravityEnabled', 'axionEnabled'], params: { axionMass: mA }, boundary: BOUND_LOOP });
        gp.addParticle({ x: 32, y: 24, mass: 10 });
        const N = GPU_SCALAR_GRID;
        gp.device.queue.writeBuffer(gp._axionBuffers.field, 0, new Float32Array(N * N).fill(0.01));
        const deep = 64 * N + 64, far = 0;
        const dt = 0.02;
        const tZero = { deep: null, far: null };
        let prev = null, t = 0, phi = null;
        while ((tZero.deep === null || tZero.far === null) && t < 40) {
            gp.update(dt);
            t += dt;
            const a = new Float32Array(await readBuffer(gp, gp._axionBuffers.field, N * N * 4));
            if (!phi) phi = new Float32Array(await readBuffer(gp, gp._gravGrid.metricPhi, N * N * 4));
            for (const [k, idx] of [['deep', deep], ['far', far]]) {
                if (tZero[k] === null && prev && prev[idx] > 0 && a[idx] <= 0) {
                    tZero[k] = t - dt * a[idx] / (a[idx] - prev[idx]);
                }
            }
            prev = a;
        }
        gp.destroy();
        const expected = Math.exp(phi[far] - phi[deep]);
        const measured = tZero.deep / tZero.far;
        const t0 = (p) => Math.PI / (2 * mA * Math.exp(p));
        return {
            expected: `t₀ = ${fmt(t0(phi[deep]))}, ${fmt(t0(phi[far]))}; ratio ${fmt(expected)}`,
            measured: `t₀ = ${fmt(tZero.deep)}, ${fmt(tZero.far)}; ratio ${fmt(measured)}`,
            metric: `${fmt((measured / expected - 1) * 100, 2)}%`,
            pass: Math.abs(measured / expected - 1) < 0.02,
        };
    },
});

// ── Clocks (M1) ──

// A free clock runs at dτ/dt = 1/γ; with relativity off, at 1.
cases.push({
    name: 'Free clock at γ = 2 runs at dτ/dt = 1/2',
    async run() {
        const gp = await makeSim({ on: ['relativityEnabled'], boundary: BOUND_LOOP });
        gp.addParticle({ x: 32, y: 24, vx: Math.sqrt(3), vy: 0, mass: 1 });
        gp.addParticle({ x: 32, y: 40, mass: 1 });
        await run(gp, 100, 0.25);
        const [moving, rest] = await readClocks(gp, 2);
        gp.destroy();
        return { expected: 'τ = 50.00, 100.0', measured: `τ = ${fmt(moving.tau)}, ${fmt(rest.tau)}`,
                 metric: `${fmt((moving.tau / 50 - 1) * 100, 2)}%`,
                 pass: Math.abs(moving.tau / 50 - 1) < 1e-3 && Math.abs(rest.tau / 100 - 1) < 1e-3 };
    },
});

// A clock at rest a distance r from mass M: dτ/dt = √(1 + 2Φ), Φ = −M/√(r² + ε²).
// (Unsoftened, 1 − 2M/r: the Schwarzschild g_tt.)
cases.push({
    name: 'Static clock near a mass: dτ/dt = √(1 + 2Φ_N)',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'relativityEnabled'] });
        const M = 10, r = 20;
        gp.addParticle({ x: 32, y: 24, mass: M, bornAt: -Infinity });
        gp.addParticle({ x: 32 + r, y: 24, mass: 1e-4, bornAt: -Infinity });
        await run(gp, 0.05, 0.05);
        const [, clock] = await readClocks(gp, 2);
        gp.destroy();
        const expected = Math.sqrt(1 - 2 * M / Math.sqrt(r * r + SOFTENING_SQ));
        return { expected: fmt(expected, 5), measured: fmt(clock.lapse, 5),
                 metric: `${fmt((clock.lapse / expected - 1) * 100, 2)}%`, pass: Math.abs(clock.lapse / expected - 1) < 2e-3 };
    },
});

// On a circular orbit the clock runs at √(1 − 3M/r) (Schwarzschild, exact); with
// Newtonian gravity and r ≫ ε the lapse should agree to O(M²/r²).
cases.push({
    name: 'Circular-orbit clock: dτ/dt = √(1 − 3M/r) (r ≫ ε)',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'relativityEnabled'], domainW: 1024, domainH: 1024 });
        const M = 10, r = 400;
        const v = vCircRel(M, r, 1);
        gp.addParticle({ x: 512, y: 512, mass: M, bornAt: -Infinity });
        gp.addParticle({ x: 512 + r, y: 512, vx: 0, vy: v / Math.sqrt(1 - v * v), mass: 1e-4, bornAt: -Infinity });
        await run(gp, 50, 0.5);
        const [, clock] = await readClocks(gp, 2);
        gp.destroy();
        const expected = Math.sqrt(1 - 3 * M / r);
        const rate = clock.tau / 50;
        return { expected: fmt(expected, 5), measured: fmt(rate, 5),
                 metric: `${fmt((rate / expected - 1) * 100, 3)}%`, pass: Math.abs(rate / expected - 1) < 1e-3 };
    },
});

// Thomas precession: a non-spinning charge on a circular Coulomb orbit turns its spoke
// by −2π(γ − 1) per orbit (retrograde). Gravity plays no part.
cases.push({
    name: 'Thomas precession: −2π(γ − 1) per Coulomb orbit',
    async run() {
        const gp = await makeSim({ on: ['coulombEnabled', 'relativityEnabled'], domainW: 128, domainH: 128 });
        const r = 16, Q = 12, q = -2;
        const v = vCircRel(Q * Math.abs(q), r, 1);
        const gamma = 1 / Math.sqrt(1 - v * v);
        gp.addParticle({ x: 64, y: 64, mass: 1e5, charge: Q, bornAt: -Infinity });
        gp.addParticle({ x: 64 + r, y: 64, vx: 0, vy: gamma * v, mass: 1, charge: q, bornAt: -Infinity });
        const dTheta = await precessionOverOrbit(gp, 1, 2 * Math.PI * r / v, 0.05);
        gp.destroy();
        const expected = -2 * Math.PI * (gamma - 1);
        return { expected: `${fmt(expected * 180 / Math.PI)}° (v = ${fmt(v, 3)})`, measured: `${fmt(dTheta * 180 / Math.PI)}°`,
                 metric: `${fmt((dTheta / expected - 1) * 100, 2)}%`, pass: Math.abs(dTheta / expected - 1) < 0.03 };
    },
});

// Geodetic precession: a gyroscope on a circular orbit turns its spoke forward by
// (3/2)·g·v per unit time, 3π·g·r per orbit (3πM/r unsoftened), with no Thomas term
// from gravity.
cases.push({
    name: 'Geodetic precession: 3π·g·r per gravitational orbit',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'relativityEnabled'], domainW: 1024, domainH: 1024 });
        const M = 100, r = 400;
        const v = vCircRel(M, r, 1);
        gp.addParticle({ x: 512, y: 512, mass: M, bornAt: -Infinity });
        gp.addParticle({ x: 512 + r, y: 512, vx: 0, vy: v / Math.sqrt(1 - v * v), mass: 1e-4, bornAt: -Infinity });
        const dTheta = await precessionOverOrbit(gp, 1, 2 * Math.PI * r / v, 1);
        gp.destroy();
        const g = M * r / Math.pow(r * r + SOFTENING_SQ, 1.5);
        const expected = 3 * Math.PI * g * r;
        return { expected: `${fmt(expected * 180 / Math.PI)}° (v = ${fmt(v, 3)})`, measured: `${fmt(dTheta * 180 / Math.PI)}°`,
                 metric: `${fmt((dTheta / expected - 1) * 100, 2)}%`, pass: Math.abs(dTheta / expected - 1) < 0.03 };
    },
});

// World lines: a birth sample, then one per WORLDLINE_DT of lab time, carrying t, x, w and τ.
cases.push({
    name: 'World lines sample every WORLDLINE_DT with position and proper time',
    async run() {
        const gp = await makeSim({ on: ['relativityEnabled'], domainW: 256, domainH: 64 });
        const v = 0.6, gamma = 1.25;
        gp.addParticle({ x: 8, y: 32, vx: gamma * v, vy: 0, mass: 1 });
        await run(gp, 20, 0.02);
        const meta = new Uint32Array(await readBuffer(gp, gp.buffers.wlMeta, 16));
        const count = meta[1];
        const data = new Float32Array(await readBuffer(gp, gp.buffers.wlData, count * WL_STRIDE * 4));
        gp.destroy();
        let worstDt = 0, worstX = 0, worstTau = 0;
        for (let k = 2; k < count; k++) {   // sample 0 is the birth sample at t = 0
            const a = (k - 1) * WL_STRIDE, b = k * WL_STRIDE;
            const dt = data[b] - data[a];
            worstDt = Math.max(worstDt, Math.abs(dt - WORLDLINE_DT));
            worstX = Math.max(worstX, Math.abs((data[b + 1] - data[a + 1]) - v * dt));
            worstTau = Math.max(worstTau, Math.abs((data[b + 7] - data[a + 7]) - dt / gamma));
        }
        const expectedCount = 1 + Math.round(20 / WORLDLINE_DT);
        return { expected: `${expectedCount} samples, Δt = ${WORLDLINE_DT}`, measured: `${count} samples`,
                 metric: `|ΔΔt| ${fmt(worstDt, 2)}, |Δx| ${fmt(worstX, 2)}, |Δτ| ${fmt(worstTau, 2)}`,
                 pass: Math.abs(count - expectedCount) <= 1 && worstDt < 0.021 && worstX < 1e-4 && worstTau < 1e-4 };
    },
});

// Barnes–Hut must reproduce the pairwise sum on a torus. Ghost copies once weighed as much
// as their originals there, and every tree walk min-images, so each pair counted twice.
cases.push({
    name: 'Barnes–Hut equals the pairwise sum on a torus, across the seam and inside',
    async run() {
        const kick = async (bh, x1, x2) => {
            const gp = await makeSim({ on: ['gravityEnabled', ...(bh ? ['barnesHutEnabled'] : [])],
                                       domainW: 64, domainH: 64, boundary: BOUND_LOOP });
            gp.addParticle({ x: x1, y: 32, mass: 1000 });
            gp.addParticle({ x: x2, y: 32, mass: 1 });
            gp.update(0.01);
            const [, p] = await readParticles(gp);
            gp.destroy();
            return p.wx;
        };
        // Separation 6 either way: F/m = 1000·6/(36 + ε²)^{3/2}, one kick of 0.01
        const expected = 0.01 * 1000 * 6 / Math.pow(36 + SOFTENING_SQ, 1.5);
        const got = [await kick(false, 2, 60), await kick(true, 2, 60), await kick(false, 26, 32), await kick(true, 26, 32)];
        const want = [expected, expected, -expected, -expected];
        const worst = Math.max(...got.map((g, i) => Math.abs(g / want[i] - 1)));
        return { expected: `Δw = ±${fmt(expected, 4)}`, measured: got.map(g => fmt(g, 4)).join(', '),
                 metric: `${fmt(worst * 100, 2)}%`, pass: worst < 1e-3 };
    },
});

// Co-moving like charges (relativity off): the magnetic force q v × B, with the Biot–Savart
// field of the partner, takes w² of the electric repulsion away. The field's sign was once
// reversed, which made it add w² instead.
cases.push({
    name: 'Co-moving like charges: the magnetic force cancels w² of the electric (Biot–Savart sign)',
    async run() {
        const w = 0.75;
        const lateral = async (mag) => {
            const gp = await makeSim({ on: ['coulombEnabled', ...(mag ? ['magneticEnabled'] : [])], domainW: 256, domainH: 256 });
            gp.addParticle({ x: 100, y: 128, vx: w, mass: 1000, charge: 2 });
            gp.addParticle({ x: 100, y: 138, vx: w, mass: 1000, charge: 2 });
            await run(gp, 1, 0.05);
            const [, p] = await readParticles(gp);
            gp.destroy();
            return p.wy;
        };
        const ratio = await lateral(true) / await lateral(false);
        const expected = 1 - w * w;
        return { expected: fmt(expected, 4), measured: fmt(ratio, 4),
                 metric: `${fmt((ratio / expected - 1) * 100, 2)}%`, pass: Math.abs(ratio / expected - 1) < 1e-3 };
    },
});

// Gravitomagnetic clock effect (relativity off): around a spinning mass, prograde circular
// orbits run slow and retrograde ones fast, T₊ − T₋ = 4πJ/M at first order in J
// (Cohen & Mashhoon 1993). With the softened kernel s = (r² + ε²)^{-3/2}, a circular orbit has
// Ω² ± 2JsΩ − Ms = 0, and softening cancels from the leading term.
cases.push({
    name: 'Gravitomagnetic clock effect: prograde minus retrograde period = 4πJ/M',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'gravitomagEnabled'], domainW: 256, domainH: 256 });
        const M = 10, r = 40, R = Math.cbrt(M), omega = 0.5 / R;
        const J = INERTIA_K * M * omega * R * R;
        const s3 = Math.pow(r * r + SOFTENING_SQ, -1.5);
        const Om = (sign) => -sign * J * s3 + Math.sqrt(J * J * s3 * s3 + M * s3);
        gp.addParticle({ x: 128, y: 128, mass: M, angw: omega });
        gp.addParticle({ x: 128 + r, y: 128, vy: Om(1) * r, mass: 1e-3 });    // prograde
        gp.addParticle({ x: 128 - r, y: 128, vy: Om(-1) * r, mass: 1e-3 });   // retrograde: +y at −x, L < 0
        const T = [2 * Math.PI / Om(1), 2 * Math.PI / Om(-1)];
        // Unwrapped orbital angle of each, until both have gone once round
        const angle = (p, c) => Math.atan2(p.y - c.y, p.x - c.x);
        let ps = await readParticles(gp);
        let last = [angle(ps[1], ps[0]), angle(ps[2], ps[0])];
        const swept = [0, 0], period = [0, 0];
        const dt = 0.25;
        let t = 0;
        while ((!period[0] || !period[1]) && t < 1.2 * Math.max(...T)) {
            gp.update(dt);
            t += dt;
            ps = await readParticles(gp);
            for (let k = 0; k < 2; k++) {
                const a = angle(ps[k + 1], ps[0]);
                let d = a - last[k];
                d -= 2 * Math.PI * Math.round(d / (2 * Math.PI));
                const before = swept[k];
                swept[k] += Math.abs(d);
                last[k] = a;
                if (!period[k] && swept[k] >= 2 * Math.PI) {
                    period[k] = t - dt + dt * (2 * Math.PI - before) / (swept[k] - before);
                }
            }
        }
        gp.destroy();
        const expected = T[0] - T[1], measured = period[0] - period[1];
        return { expected: `${fmt(expected, 4)} (4πJ/M = ${fmt(4 * Math.PI * J / M, 4)})`, measured: fmt(measured, 4),
                 metric: `${fmt((measured / expected - 1) * 100, 2)}%`, pass: Math.abs(measured / expected - 1) < 0.03 };
    },
});

// Liénard–Wiechert: a charge in uniform motion pulls along the line from its *present*
// position, E = q(1 − v²)R̂/(R²(1 − v² sin²ψ)^{3/2}), γq/b² abeam (Jackson §11.10), times the
// softening σ³, σ = R_ret/√(R_ret² + ε²), at the retarded distance.
cases.push({
    name: 'Liénard–Wiechert: a uniformly moving charge acts from its present position',
    async run() {
        const gp = await makeSim({ on: ['coulombEnabled', 'relativityEnabled'], domainW: 1024, domainH: 1024 });
        const v = 0.6, g = 1 / Math.sqrt(1 - v * v), Q = 10, q = 0.1, b = 40, t0 = 100, dt = 0.25;
        const x0 = 512 - v * t0;
        gp.addParticle({ x: x0, y: 512, vx: g * v, mass: 1e6, charge: Q, bornAt: -Infinity });
        gp.addParticle({ x: 512, y: 512 + b, mass: 1e6, charge: q, bornAt: -Infinity });
        await run(gp, t0, dt);
        const af = new Float32Array(await readBuffer(gp, gp.buffers.allForces, 2 * 160));
        gp.destroy();
        const F = [af[40 + 2], af[40 + 3]];   // slot 1, f0.zw (Coulomb)
        // The last force pass ran at the start of the last substep, t_e = t0 − dt
        const te = t0 - dt;
        const xs = (t) => x0 + v * t;
        const Rp = [512 - xs(te), b];
        const Rlen = Math.hypot(...Rp), sin2 = (Rp[1] / Rlen) ** 2;
        let tr = te - Rlen;                   // retarded time: |obs − x_s(t_r)| = t_e − t_r
        for (let k = 0; k < 40; k++) tr = te - Math.hypot(512 - xs(tr), b);
        const Rret = te - tr, sigma = Rret / Math.sqrt(Rret * Rret + SOFTENING_SQ);
        const k = q * Q * (1 - v * v) / (Rlen ** 3 * Math.pow(1 - v * v * sin2, 1.5)) * sigma ** 3;
        const want = [k * Rp[0], k * Rp[1]];
        const err = Math.hypot(F[0] - want[0], F[1] - want[1]) / Math.hypot(...want);
        return { expected: `(${fmt(want[0], 3)}, ${fmt(want[1], 4)}); abeam γqQ/b² = ${fmt(g * q * Q / (b * b), 4)}`,
                 measured: `(${fmt(F[0], 3)}, ${fmt(F[1], 4)})`, metric: `${fmt(err * 100, 2)}%`, pass: err < 2e-3 };
    },
});

// The same field after the source has wrapped a torus three times and the GPU epoch has
// rebased twice: the world line must stay continuous on the covering plane, and the observer
// must see the nearest image.
cases.push({
    name: 'Liénard–Wiechert across torus wraps and epoch rebases',
    async run() {
        const W = 128, v = 0.6, g = 1 / Math.sqrt(1 - v * v), Q = 10, q = 0.1, b = 20, dt = 0.25, T = 700;
        const gp = await makeSim({ on: ['coulombEnabled', 'relativityEnabled'], domainW: W, domainH: W, boundary: BOUND_LOOP });
        gp.addParticle({ x: 10, y: 64, vx: g * v, mass: 1e6, charge: Q, bornAt: -Infinity });
        gp.addParticle({ x: 100, y: 64 + b, mass: 1e6, charge: q, bornAt: -Infinity });
        await run(gp, T, dt);
        const af = new Float32Array(await readBuffer(gp, gp.buffers.allForces, 2 * 160));
        const epoch = gp.timeEpoch;
        gp.destroy();
        const F = [af[40 + 2], af[40 + 3]];
        const te = T - dt;
        const xs = (t) => 10 + v * t;   // unwrapped
        // The image nearest now, followed back along its own world line (minimum image is
        // chosen at the present, as the solver does)
        const shift = -W * Math.round((100 - xs(te)) / W);
        const dxAt = (t) => 100 - xs(t) + shift;
        const Rp = [dxAt(te), b];
        const Rlen = Math.hypot(...Rp), sin2 = (Rp[1] / Rlen) ** 2;
        let tr = te - Rlen;
        for (let k = 0; k < 40; k++) tr = te - Math.hypot(dxAt(tr), b);
        const Rret = te - tr, sigma = Rret / Math.sqrt(Rret * Rret + SOFTENING_SQ);
        const k = q * Q * (1 - v * v) / (Rlen ** 3 * Math.pow(1 - v * v * sin2, 1.5)) * sigma ** 3;
        const want = [k * Rp[0], k * Rp[1]];
        const err = Math.hypot(F[0] - want[0], F[1] - want[1]) / Math.hypot(...want);
        return { expected: `(${fmt(want[0], 4)}, ${fmt(want[1], 4)}), ${Math.floor(xs(te) / W)} wraps`,
                 measured: `(${fmt(F[0], 4)}, ${fmt(F[1], 4)}), epoch ${epoch}`,
                 metric: `${fmt(err * 100, 2)}%`, pass: err < 2e-3 && epoch > 0 };
    },
});

// 1PN perihelion advance (test-mass limit): Schwarzschild's 6πM/p per orbit, p the semi-latus
// rectum, of which the special-relativistic Kepler problem supplies πM/p, so switching 1PN on
// adds the rest. Each run measures its own p from periapsis and apoapsis; the difference
// cancels softening's own precession.
cases.push({
    name: '1PN perihelion advance: 6πM/p with 1PN, πM/p from special relativity alone',
    async run() {
        // Weak field, M/r_p = 0.01: at stronger fields the 1PN energy shift unbinds the orbit
        // far more than its precession changes
        const M = 2, rp = 200, p0 = 300, C = 2048;
        const advance = async (pn) => {
            const gp = await makeSim({ on: ['gravityEnabled', 'gravitomagEnabled', 'relativityEnabled',
                                            ...(pn ? ['onePNEnabled'] : [])], domainW: 2 * C, domainH: 2 * C });
            gp.addParticle({ x: C, y: C, mass: M, bornAt: -Infinity });
            gp.addParticle({ x: C + rp, y: C, vy: Math.sqrt(M * p0) / rp, mass: 1e-4, bornAt: -Infinity });
            const sample = async () => {
                const [c, q] = await readParticles(gp);
                return { r: Math.hypot(q.x - c.x, q.y - c.y), a: Math.atan2(q.y - c.y, q.x - c.x) };
            };
            // Coarse: out through apoapsis and most of the way back
            let ra = 0, prev = rp;
            for (let k = 0; k < 4000; k++) {
                for (let j = 0; j < 10; j++) gp.update(2);
                const { r } = await sample();
                ra = Math.max(ra, r);
                if (r < prev && r < 1.3 * rp) break;
                prev = r;
            }
            // Fine: the minimum of r, fitted by a parabola through three samples. The orbit
            // started at periapsis on the +x axis, so this periapsis's angle is the advance.
            const hist = [];
            for (let k = 0; k < 8000; k++) {
                gp.update(0.5);
                hist.push(await sample());
                const n = hist.length;
                if (n >= 3 && hist[n - 2].r < hist[n - 3].r && hist[n - 2].r <= hist[n - 1].r) {
                    const [h0, h1, h2] = hist.slice(n - 3);
                    const off = 0.5 * (h0.r - h2.r) / (h0.r - 2 * h1.r + h2.r);
                    const nb = off > 0 ? h2.a - h1.a : h1.a - h0.a;
                    let aV = h1.a + off * (nb - 2 * Math.PI * Math.round(nb / (2 * Math.PI)));
                    aV -= 2 * Math.PI * Math.round(aV / (2 * Math.PI));
                    gp.destroy();
                    return { adv: aV, p: 2 * rp * ra / (rp + ra) };
                }
            }
            gp.destroy();
            return { adv: NaN, p: NaN };
        };
        const on = await advance(true), off = await advance(false);
        const expected = 6 * Math.PI * M / on.p - Math.PI * M / off.p;
        const measured = on.adv - off.adv;
        const deg = (x) => `${fmt(x * 180 / Math.PI)}°`;
        return { expected: `${deg(expected)} (p = ${fmt(on.p, 4)}, ${fmt(off.p, 4)})`,
                 measured: `${deg(measured)}; SR alone ${deg(off.adv)} vs πM/p ${deg(Math.PI * M / off.p)}`,
                 metric: `${fmt((measured / expected - 1) * 100, 2)}%`, pass: Math.abs(measured / expected - 1) < 0.05 };
    },
});

// Frames: a boost frame (frame-slice.wgsl) cuts world lines on t − u·x = const and draws them
// in the observer's coordinates. Lab-static bodies L apart along u sit L/γ apart and move at
// −u; a body at v composes to (v − u)/(1 − uv); lab-synchronized static clocks L apart read
// u·L apart on the observer's now (relativity of simultaneity).
async function readView(gp, n) {
    const fb = gp.frameBuffers;
    const st = new Float32Array(await readBuffer(gp, fb.viewState, n * PARTICLE_STATE_SIZE));
    const st32 = new Uint32Array(st.buffer);
    const dv = new Float32Array(await readBuffer(gp, fb.viewDerived, n * 32));
    const ck = new Float32Array(await readBuffer(gp, fb.viewClocks, n * 16));
    return Array.from({ length: n }, (_, i) => ({
        x: st[i * 9], y: st[i * 9 + 1], valid: (st32[i * 9 + 8] & 1) !== 0,
        vx: dv[i * 8 + 4], vy: dv[i * 8 + 5], tau: ck[i * 4],
    }));
}

async function readFrameState(gp) {
    const f = new Float32Array(await readBuffer(gp, gp.frameBuffers.frameState, 80));
    return { ux: f[0], uy: f[1], gamma: f[2], tA: f[3], xA: [f[4], f[5]], lag: f[9], valid: f[11] > 0.5 };
}

function frameParams(o) {
    return Object.assign({
        kind: 3, slot: 0, lorentz: true, images: 1, boostX: 0, boostY: 0, originX: 0, originY: 0,
        refT: 0, lookBack: 0, viewX: 0, viewY: 0, viewHalfW: 40, viewHalfH: 40, omega: 0,
    }, o);
}

cases.push({
    name: 'Frames: rulers contract by 1/γ, velocities compose, lab clocks read u·L apart',
    async run() {
        const gp = await makeSim({ on: ['relativityEnabled'], domainW: 512, domainH: 512 });
        const L = 60, u = 0.6, g = 1.25, v = 0.5;
        gp.addParticle({ x: 200, y: 256, mass: 1, bornAt: -Infinity });
        gp.addParticle({ x: 200 + L, y: 256, mass: 1, bornAt: -Infinity });
        gp.addParticle({ x: 230, y: 300, vx: v / Math.sqrt(1 - v * v), mass: 1, bornAt: -Infinity });
        await run(gp, 60, 0.25);
        gp.sliceFrame(frameParams({ boostX: u, originX: 230, originY: 256, refT: gp.simTime }));
        const [a, b, c] = await readView(gp, 3);
        gp.destroy();
        // B is further along u, so the slice meets it later in lab time: it reads ahead
        const sep = b.x - a.x, dTau = b.tau - a.tau;
        const vC = (v - u) / (1 - u * v);
        const errs = [sep / (L / g) - 1, a.vx / -u - 1, c.vx / vC - 1, dTau / (u * L) - 1];
        const worst = Math.max(...errs.map(Math.abs));
        return { expected: `Δx′ ${fmt(L / g, 4)}, v′ −0.6 and ${fmt(vC, 4)}, Δτ ${fmt(u * L, 4)}`,
                 measured: `${fmt(sep, 4)}, ${fmt(a.vx, 4)} and ${fmt(c.vx, 4)}, ${fmt(dTau, 4)}`,
                 metric: `${fmt(worst * 100, 2)}%`, pass: a.valid && b.valid && c.valid && worst < 2e-3 };
    },
});

// An observer under constant proper acceleration a (a charge in a uniform field, F = qE):
// all its instantaneous rest-frame slices pass through one event, at proper distance 1/a
// behind it (the Rindler bifurcation).
cases.push({
    name: 'Frames: an accelerated observer’s slices pivot 1/a behind it (Rindler)',
    async run() {
        const E = 0.01, q = 1, m = 1, a = q * E / m;
        const gp = await makeSim({ on: ['relativityEnabled'], params: { extElectric: E, extElectricAngle: 0 },
                                   domainW: 4096, domainH: 512 });
        gp.addParticle({ x: 200, y: 256, mass: m, charge: q, bornAt: -Infinity });
        const slices = [];
        for (const T of [40, 80]) {
            await run(gp, T - gp.simTime, 0.25);
            gp.sliceFrame(frameParams({ kind: 2, slot: 0, viewHalfW: 1, viewHalfH: 1 }));
            slices.push(await readFrameState(gp));
        }
        gp.destroy();
        // Each slice: t − u·x = t_A − u·x_A (along x); their crossing
        const c = slices.map(s => s.tA - s.ux * s.xA[0]);
        const xP = (c[0] - c[1]) / (slices[1].ux - slices[0].ux);
        const tP = c[1] + slices[1].ux * xP;
        const s2 = slices[1];
        const proper = Math.sqrt((s2.xA[0] - xP) ** 2 - (s2.tA - tP) ** 2);
        return { expected: `1/a = ${fmt(1 / a, 4)}`, measured: `${fmt(proper, 4)} (u = ${fmt(slices[0].ux, 3)}, ${fmt(s2.ux, 3)})`,
                 metric: `${fmt((proper * a - 1) * 100, 2)}%`, pass: slices.every(s => s.valid) && Math.abs(proper * a - 1) < 0.01 };
    },
});

// The torus twin (Barrow & Levin 2001): on a torus of length L a traveller at v sees its own
// earlier image γL behind it, its clock γvL behind, because the identification x ~ x + L holds
// at equal lab time. Slices the traveller's frame with the torus images (3×3) on.
cases.push({
    name: 'Torus twin: in its own frame the traveller’s image is γL away and γvL behind',
    async run() {
        const L = 96, v = 0.8, g = 1 / Math.sqrt(1 - v * v);
        const gp = await makeSim({ on: ['relativityEnabled'], domainW: L, domainH: 32, boundary: BOUND_LOOP });
        gp.addParticle({ x: 16, y: 13, mass: 1, bornAt: -Infinity });
        gp.addParticle({ x: 16, y: 19, vx: g * v, mass: 1, bornAt: -Infinity });
        await run(gp, 100, 0.25);
        gp.sliceFrame(frameParams({ kind: 2, slot: 1, images: 9, viewHalfW: 1, viewHalfH: 1 }));
        const views = await readView(gp, 2 * 9);
        gp.destroy();
        // Slot 1's images 3, 4, 5 are the copies at −L, 0, +L along x; the earlier one is valid
        const self = views[9 + 4];
        const img = [views[9 + 3], views[9 + 5]].find(w => w.valid);
        const sep = Math.abs(img.x - self.x), lagTau = self.tau - img.tau;
        const errs = [sep / (g * L) - 1, lagTau / (g * v * L) - 1];
        const worst = Math.max(...errs.map(Math.abs));
        return { expected: `γL = ${fmt(g * L, 4)}, γvL = ${fmt(g * v * L, 4)}`,
                 measured: `${fmt(sep, 4)}, ${fmt(lagTau, 4)}`,
                 metric: `${fmt(worst * 100, 2)}%`, pass: self.valid && !!img && worst < 2e-3 };
    },
});

// The bounce twin: out to a wall at 0.8c and back. On both coasting legs the traveller's clock
// runs at exactly 1/γ of home's; the soft Hertz-wall turnaround is slower and ages it more, so
// the round trip lands between 1/γ and 1, younger than home either way.
cases.push({
    name: 'Twin paradox: the traveller coasts at 1/γ and comes home younger',
    async run() {
        const v = 0.8, g = 1 / Math.sqrt(1 - v * v);
        const gp = await makeSim({ on: ['relativityEnabled'], domainW: 160, domainH: 40, boundary: 1 });
        gp.addParticle({ x: 12, y: 17, mass: 1 });
        gp.addParticle({ x: 12, y: 23, vx: g * v, mass: 1 });
        let t = 0, prevDx = 0, coastT = 0, coastTau = 0, prev = null, clocks = null;
        for (let k = 0; k < 4000; k++) {
            gp.update(0.25);
            t += 0.25;
            const [h, tr] = await readParticles(gp);
            const ck = await readClocks(gp, 2);
            const w = Math.hypot(tr.wx, tr.wy), speed = w / Math.sqrt(1 + w * w);
            if (prev && speed > 0.799) { coastT += ck[0].tau - prev[0].tau; coastTau += ck[1].tau - prev[1].tau; }
            prev = ck;
            const dx = tr.x - h.x;
            if (t > 50 && prevDx > 0 && dx <= 0) { clocks = ck; break; }
            prevDx = dx;
        }
        gp.destroy();
        const coast = coastTau / coastT, trip = clocks[1].tau / clocks[0].tau;
        return { expected: `coasting 1/γ = ${fmt(1 / g, 4)}; round trip in (1/γ, 1)`,
                 measured: `coasting ${fmt(coast, 5)} over ${fmt(coastT, 4)}; round trip ${fmt(trip, 4)}`,
                 metric: `${fmt((coast * g - 1) * 100, 3)}%`,
                 pass: Math.abs(coast * g - 1) < 2e-3 && trip > 1 / g && trip < 1 };
    },
});

// π⁰ beam at γ = 5: survival N/N₀ = exp(−ln2·t/(γT½)) in lab time t.
cases.push({
    name: 'π⁰ beam at γ = 5 decays on proper time (lab t = γT½, 2γT½)',
    async run() {
        const gp = await makeSim({ on: ['yukawaEnabled'] });
        gp.addParticle({ x: 63, y: 47, mass: 0.001 }); // the step needs one particle; far from the beam
        const n = 1024, gamma = 5, w = Math.sqrt(gamma * gamma - 1);
        addPions(gp, Array.from({ length: n }, (_, i) => ({ x: 4, y: 4 + (i % 32), wx: w, wy: 0, mass: 0.15, charge: 0 })));
        const tHalf = gamma * PION_HALF_LIFE;
        await run(gp, tHalf, 1);
        const f1 = await countAlivePions(gp, n) / n;
        await run(gp, tHalf, 1);
        const f2 = await countAlivePions(gp, n) / n;
        gp.destroy();
        const sigma = (p) => Math.sqrt(p * (1 - p) / n);
        const undilated = Math.exp(-Math.LN2 * tHalf / PION_HALF_LIFE);
        return {
            expected: `0.500, 0.250 (undilated ${fmt(undilated, 2)})`,
            measured: `${fmt(f1, 3)}, ${fmt(f2, 3)}`,
            metric: `${fmt((f1 - 0.5) / sigma(0.5), 2)}σ, ${fmt((f2 - 0.25) / sigma(0.25), 2)}σ`,
            pass: Math.abs(f1 - 0.5) < 4 * sigma(0.5) && Math.abs(f2 - 0.25) < 4 * sigma(0.25),
        };
    },
});

// π± at rest: half-life T½ = 64 in its own (= lab) frame.
cases.push({
    name: 'π± at rest: half survive one half-life',
    async run() {
        const gp = await makeSim({ on: ['yukawaEnabled'] });
        gp.addParticle({ x: 63, y: 47, mass: 0.001 });
        const n = 1024;
        addPions(gp, Array.from({ length: n }, (_, i) => ({ x: 4 + (i % 32), y: 4 + Math.floor(i / 32), wx: 0, wy: 0, mass: 0.15, charge: BOSON_CHARGE })));
        await run(gp, CHARGED_PION_HALF_LIFE, 1);
        const f = await countAlivePions(gp, n) / n;
        gp.destroy();
        const sigma = Math.sqrt(0.25 / n);
        return { expected: '0.500', measured: fmt(f, 3), metric: `${fmt((f - 0.5) / sigma, 2)}σ`, pass: Math.abs(f - 0.5) < 4 * sigma };
    },
});

// Schwarzschild Hawking power P = 1/(15360π M²) on the hole's clock:
// M³ = M₀³ − 3C·t/γ, C = 1/(15360π).
const HAWKING_C = 1 / (15360 * Math.PI);
async function hawkingHole(gamma, T, dt) {
    const gp = await makeSim({ on: ['blackHoleEnabled', 'radiationEnabled', 'relativityEnabled'], boundary: BOUND_LOOP });
    const w = Math.sqrt(gamma * gamma - 1);
    gp.addParticle({ x: 32, y: 24, vx: w, vy: 0, mass: 1 });
    await run(gp, T, dt);
    const [p] = await readParticles(gp);
    gp.destroy();
    return p;
}

cases.push({
    name: 'Hawking mass loss runs on the hole\'s clock (γ = 1, 2; lab t = 2000)',
    async run() {
        const T = 2000;
        const expect = (g) => Math.cbrt(1 - 3 * HAWKING_C * T / g);
        const m1 = (await hawkingHole(1, T, 2)).mass;
        const m2 = (await hawkingHole(2, T, 2)).mass;
        const e1 = expect(1), e2 = expect(2);
        const r1 = Math.abs(m1 - e1) / (1 - e1), r2 = Math.abs(m2 - e2) / (1 - e2);
        return {
            expected: `M = ${fmt(e1, 5)}, ${fmt(e2, 5)}`,
            measured: `M = ${fmt(m1, 5)}, ${fmt(m2, 5)}`,
            metric: `ΔM error ${fmt(r1 * 100, 2)}%, ${fmt(r2 * 100, 2)}%`,
            pass: r1 < 0.02 && r2 < 0.02,
        };
    },
});

cases.push({
    name: 'A hole at γ = 2 takes twice the lab time to evaporate (M₀ = 0.5)',
    async run() {
        const lifetime = async (gamma) => {
            const gp = await makeSim({ on: ['blackHoleEnabled', 'radiationEnabled', 'relativityEnabled'], boundary: BOUND_LOOP });
            gp.addParticle({ x: 32, y: 24, vx: Math.sqrt(gamma * gamma - 1), vy: 0, mass: 0.5 });
            const dt = 2, poll = 10;
            let t = 0;
            for (;;) {
                await run(gp, poll * dt, dt);
                t += poll * dt;
                const [p] = await readParticles(gp);
                if (!p.alive || t > 20000) break;
            }
            gp.destroy();
            return t;
        };
        const tauRest = (0.5 ** 3 - MIN_MASS ** 3) / (3 * HAWKING_C);
        const t1 = await lifetime(1), t2 = await lifetime(2);
        const ratio = t2 / t1;
        return {
            expected: `t = ${fmt(tauRest)}, ratio 2`,
            measured: `t = ${fmt(t1)}, ${fmt(t2)}`,
            metric: `ratio ${fmt(ratio, 4)}`,
            pass: Math.abs(ratio - 2) < 0.06 && Math.abs(t1 / tauRest - 1) < 0.03,
        };
    },
});

// ── Cosmology (M3) ──

/** A sim with expansion's pipelines ready: makeSim, then the Phase 5 pipelines Expansion builds. */
async function makeUniverse(opts) {
    const gp = await makeSim({ boundary: BOUND_LOOP, ...opts });
    await gp._ensurePhase5Pipelines();
    return gp;
}

/** Request a stats readback and wait for it (the ledger and the Friedmann densities ride on it). */
async function statsNow(gp) {
    while (gp._statsPending) await new Promise(r => setTimeout(r, 2));
    gp.requestStats(-1);
    while (gp._statsPending) await new Promise(r => setTimeout(r, 2));
    return gp.readStats();
}

/** Write photons straight into the pool: [{x, y, vx, vy, energy}]. */
function addPhotons(gp, list) {
    const buf = new ArrayBuffer(list.length * 32);
    const f = new Float32Array(buf), u = new Uint32Array(buf);
    list.forEach((p, i) => {
        const b = i * 8;
        f[b] = p.x; f[b + 1] = p.y; f[b + 2] = p.vx; f[b + 3] = p.vy; f[b + 4] = p.energy;
        u[b + 5] = 0xFFFFFFFF; f[b + 6] = 0; u[b + 7] = 1;
    });
    gp.device.queue.writeBuffer(gp.buffers.photonPool, 0, buf);
    gp.device.queue.writeBuffer(gp.buffers.phCount, 0, new Uint32Array([list.length]));
}

cases.push({
    name: 'Expansion: de Sitter a = e^{H₀t}; comoving bodies stay put, a·w and photon a·E are constant',
    async run() {
        const H0 = 0.01, T = 100, dt = 0.5;
        const gp = await makeUniverse({ on: ['expansionEnabled', 'relativityEnabled'],
                                        params: { hubbleParam: H0, cosmoSchedule: 1 }, domainW: 64, domainH: 64 });
        gp.addParticle({ x: 10, y: 20, mass: 1, bornAt: -Infinity });
        gp.addParticle({ x: 40, y: 44, vx: 2, vy: 0, mass: 1, bornAt: -Infinity });
        addPhotons(gp, [{ x: 5, y: 5, vx: 0, vy: 1, energy: 1 }]);
        await run(gp, T, dt);
        const a = gp.scaleA;
        const [rest, mover] = await readParticles(gp);
        const ph = new Float32Array(await readBuffer(gp, gp.buffers.photonPool, 32));
        gp.destroy();
        const aExp = Math.exp(H0 * T);
        const drift = Math.hypot(rest.x / a - 10, rest.y / a - 20);
        const errs = [Math.abs(a / aExp - 1), drift / 10, Math.abs(mover.wx * a / 2 - 1), Math.abs(ph[4] * a - 1)];
        return {
            expected: `a = ${fmt(aExp)}; x/a = (10, 20); a·w = 2; a·E = 1`,
            measured: `a = ${fmt(a)}; (${fmt(rest.x / a)}, ${fmt(rest.y / a)}); ${fmt(mover.wx * a)}; ${fmt(ph[4] * a)}`,
            metric: `max rel ${fmt(Math.max(...errs) * 100, 2)}%`,
            pass: Math.max(...errs) < 1e-3,
        };
    },
});

cases.push({
    name: 'Liénard–Wiechert in an expanding universe: a comoving charge acts by the proper distance now',
    async run() {
        // Maxwell is conformally invariant, so a charge at rest in comoving coordinates has the
        // static field in (η, x/a): E = q/(a·R_c)² physically, softened by σ³ as at a = 1
        const gp = await makeUniverse({ on: ['coulombEnabled', 'relativityEnabled', 'expansionEnabled'],
                                        params: { hubbleParam: 0.01, cosmoSchedule: 1 }, domainW: 128, domainH: 128 });
        const Rc = 40;
        gp.addParticle({ x: 30, y: 64, mass: 1e6, charge: 1, bornAt: -Infinity });
        gp.addParticle({ x: 30 + Rc, y: 64, mass: 1e6, charge: 1, bornAt: -Infinity });
        await run(gp, 60, 0.5);
        const a = gp.scaleA;              // the frame's forces are evaluated at the a it starts with
        gp.update(0.5);
        await gp.device.queue.onSubmittedWorkDone();
        const f = new Float32Array(await readBuffer(gp, gp.buffers.allForces, 2 * 160));
        gp.destroy();
        const R = a * Rc;
        const expect = R / Math.pow(R * R + SOFTENING_SQ, 1.5);
        const fx = f[40 + 2];             // slot 1's Coulomb x (repulsion: +x)
        return {
            expected: `F = q²R/(R² + ε²)^{3/2} = ${fmt(expect)} at R = a·R_c = ${fmt(R)}`,
            measured: `${fmt(fx)} (a = ${fmt(a)}; at a = 1 it would be ${fmt(Rc / Math.pow(Rc * Rc + SOFTENING_SQ, 1.5))})`,
            metric: `${fmt((fx / expect - 1) * 100, 2)}%`,
            pass: Math.abs(fx / expect - 1) < 0.01,
        };
    },
});

cases.push({
    name: 'Friedmann closure: dust alone expands as a ∝ (1 + 3H₀t/2)^{2/3}',
    async run() {
        // Matter at rest, no forces: ρ ∝ a⁻³ and H² = (8π/3)ρ give the Einstein–de Sitter law
        const gp = await makeUniverse({ on: ['expansionEnabled'], params: { hubbleParam: 0, cosmoSchedule: 0 },
                                        domainW: 64, domainH: 64 });
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
            gp.addParticle({ x: 8 + 16 * i, y: 8 + 16 * j, mass: 10, bornAt: -Infinity });
        }
        gp.update(1e-4);
        await statsNow(gp);
        const H0 = gp.cosmology.hubble(gp.scaleA), a0 = gp.scaleA;
        const rho = 160 / (64 * 64 * SHEET_THICKNESS);
        const T = 20;
        await run(gp, T, 0.25);
        const a = gp.scaleA / a0;
        gp.destroy();
        const aExp = Math.pow(1 + 1.5 * H0 * T, 2 / 3);
        const hExp = Math.sqrt(8 * Math.PI / 3 * rho);
        return {
            expected: `H₀ = √(8πρ/3) = ${fmt(hExp)}; a(${T}) = ${fmt(aExp)}`,
            measured: `H₀ = ${fmt(H0)}; a = ${fmt(a)}`,
            metric: `${fmt((a / aExp - 1) * 100, 2)}%, ${fmt((H0 / hExp - 1) * 100, 2)}%`,
            pass: Math.abs(a / aExp - 1) < 0.005 && Math.abs(H0 / hExp - 1) < 0.002,
        };
    },
});

cases.push({
    name: 'A uniform periodic background exerts no net in-plane force',
    async run() {
        // The minimum-image cell around each body is symmetric, so the mean density's pull
        // cancels: a lattice feels nothing, and peculiar gravity is sourced by δΣ alone. An odd
        // lattice, so that no pair sits exactly half a domain apart, where the image is a tie
        const n = 5, s = 64 / n;
        const gp = await makeSim({ on: ['gravityEnabled'], domainW: 64, domainH: 64, boundary: BOUND_LOOP });
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) gp.addParticle({ x: s * (i + 0.5), y: s * (j + 0.5), mass: 1 });
        gp.update(PHYSICS_DT);
        await gp.device.queue.onSubmittedWorkDone();
        const f = new Float32Array(await readBuffer(gp, gp.buffers.allForces, n * n * 160));
        gp.destroy();
        let worst = 0;
        for (let i = 0; i < n * n; i++) worst = Math.max(worst, Math.hypot(f[i * 40], f[i * 40 + 1]));
        const pair = s / Math.pow(s * s + SOFTENING_SQ, 1.5);
        return {
            expected: `|F| = 0 (one neighbour alone: ${fmt(pair)})`,
            measured: `max |F| = ${fmt(worst)}`,
            metric: `${fmt(worst / pair, 2)} of a pair force`,
            pass: worst / pair < 1e-4,
        };
    },
});

// ── Runner ──

/** Run every case, or those whose name contains `filter` (console: runAll('Liénard')). */
async function runAll(filter = '') {
    rowsEl.textContent = '';
    logEl.textContent = '';
    let failed = 0;
    const chosen = cases.filter(c => typeof filter !== 'string' || c.name.includes(filter));
    for (const c of chosen) {
        const tr = document.createElement('tr');
        tr.className = 'running';
        tr.innerHTML = `<td>running</td><td></td><td></td><td></td><td></td>`;
        tr.children[1].textContent = c.name;
        rowsEl.appendChild(tr);
        statusEl.textContent = c.name;
        const t0 = performance.now();
        try {
            const r = await c.run();
            tr.className = r.pass ? 'pass' : 'fail';
            tr.children[0].textContent = r.pass ? 'pass' : 'FAIL';
            tr.children[2].textContent = r.expected;
            tr.children[3].textContent = r.measured;
            tr.children[4].textContent = r.metric;
            if (!r.pass) failed++;
            logln(`${r.pass ? 'pass' : 'FAIL'}  ${c.name}  (${((performance.now() - t0) / 1000).toFixed(1)} s)`);
        } catch (e) {
            failed++;
            tr.className = 'fail';
            tr.children[0].textContent = 'ERROR';
            tr.children[4].textContent = e.message;
            logln(`ERROR ${c.name}: ${e.stack || e}`);
        }
    }
    statusEl.textContent = failed ? `${failed} of ${chosen.length} failed.` : `All ${chosen.length} passed.`;
    window.__results = { failed, total: chosen.length };
}

document.getElementById('runBtn').addEventListener('click', () => runAll());
window.runAll = runAll;
</script>
