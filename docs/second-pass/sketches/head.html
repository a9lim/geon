<title>a9l.im Sim Overhaul</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: one 1160px column. Figures run its full width; prose keeps the site's 680px measure.
   The paper is a9l.im's own: its neutrals, Newsreader, the oxblood, hairline rules. The ink- tokens are the proposed extended palette, paired per theme. */
:root {
  --canvas: #FCFCFB; --panel: #F4F3F2; --elevated: #FFFFFF;
  --text: #161514; --text2: #42413F; --muted: #666463; --accent: #983432;
  --rule: rgba(22, 21, 20, .12); --rule-strong: rgba(22, 21, 20, .55); --ul: rgba(152, 52, 50, .4);
  --scheme: light;
  --ink-indigo: #586AB2;
  --ink-prussian: #3473A3;
  --ink-verdigris: #2A7976;
  --ink-viridian: #317B55;
  --ink-sap: #5B7637;
  --ink-ochre: #8B681B;
  --ink-sienna: #9F5D31;
  --ink-umber: #7C6049;
  --ink-madder: #A65179;
  --ink-mulberry: #97588E;
  --ink-violet: #7D60A6;
  --font: 'Newsreader', 'STIX Two Text', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #121111; --panel: #161615; --elevated: #1B1A1A;
    --text: #ECEBEA; --text2: #BEBDBC; --muted: #949392; --accent: #DC5960;
    --rule: rgba(236, 235, 234, .13); --rule-strong: rgba(236, 235, 234, .5); --ul: rgba(220, 89, 96, .4);
    --scheme: dark;
    --ink-indigo: #7486CB;
    --ink-prussian: #548EBE;
    --ink-verdigris: #4A9593;
    --ink-viridian: #4F9770;
    --ink-sap: #779252;
    --ink-ochre: #A8843C;
    --ink-sienna: #BC7950;
    --ink-umber: #997D64;
    --ink-madder: #C07095;
    --ink-mulberry: #B275A9;
    --ink-violet: #977DBF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #121111; --panel: #161615; --elevated: #1B1A1A;
  --text: #ECEBEA; --text2: #BEBDBC; --muted: #949392; --accent: #DC5960;
  --rule: rgba(236, 235, 234, .13); --rule-strong: rgba(236, 235, 234, .5); --ul: rgba(220, 89, 96, .4);
  --scheme: dark;
  --ink-indigo: #7486CB;
  --ink-prussian: #548EBE;
  --ink-verdigris: #4A9593;
  --ink-viridian: #4F9770;
  --ink-sap: #779252;
  --ink-ochre: #A8843C;
  --ink-sienna: #BC7950;
  --ink-umber: #997D64;
  --ink-madder: #C07095;
  --ink-mulberry: #B275A9;
  --ink-violet: #977DBF;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--canvas); color: var(--text);
  font-family: var(--font); font-size: 19.5px; line-height: 1.58;
  font-optical-sizing: auto; font-variant-numeric: lining-nums;
  transition: background-color .2s ease, color .2s ease;
}
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-block: 36px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--ul); text-underline-offset: .2em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
.prose { max-width: 680px; display: grid; gap: 1em; }
.prose em { color: var(--text); }

/* Head */
.colophon { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-size: 22px; line-height: 1; }
.seal { width: 26px; height: 26px; fill: var(--accent); flex: none; }
.top { display: grid; gap: 18px; padding-bottom: 40px; border-bottom: 1px solid var(--rule); }
.top .meta { font-size: 15.5px; color: var(--muted); }
h1 { font-weight: 400; font-size: clamp(40px, 6.4vw, 60px); line-height: 1.04; letter-spacing: -0.018em; margin: 10px 0 0; text-wrap: balance; }
.lede { font-size: clamp(21px, 2.4vw, 26px); line-height: 1.38; color: var(--text); max-width: 760px; text-wrap: pretty; }

section { padding-top: 64px; }
section + section { border-top: 1px solid var(--rule); margin-top: 64px; }
h2 { font-weight: 400; font-size: clamp(34px, 4.6vw, 46px); line-height: 1.08; letter-spacing: -0.014em; margin: 0 0 18px; text-wrap: balance; }
h2 .sub { font-style: italic; color: var(--muted); font-size: .62em; letter-spacing: 0; margin-left: .3em; }
h3 { font-weight: 600; font-size: 21px; line-height: 1.3; margin: 0 0 10px; }
.label { font-style: italic; color: var(--muted); font-size: 17.5px; margin-bottom: 8px; }

/* Now */
.now { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; margin-top: 30px; }
.now figure { margin: 0; display: grid; gap: 8px; align-content: start; }
.now img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); }
.now figcaption { font-size: 15.5px; line-height: 1.4; color: var(--muted); font-style: italic; }

/* Shared vs owned */
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 48px; margin-top: 30px; }
.split ul { list-style: none; padding: 0; margin: 0; }
.split li { border-top: 1px solid var(--rule); padding: 10px 0; font-size: 17.5px; line-height: 1.5; color: var(--text2); }
.split li strong { font-weight: 600; color: var(--text); }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 40px; margin-top: 44px; }
.rules > div { border-top: 1px solid var(--rule-strong); padding-top: 12px; }
.rules h3 { font-size: 22px; font-weight: 400; font-style: italic; }
.rules p { font-size: 17.5px; line-height: 1.52; color: var(--text2); }

/* Figures */
.fig { margin: 30px 0 0; }
.frame { position: relative; border-block: 1px solid var(--rule); background: var(--canvas); }
.frame canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; touch-action: pan-y; }
.frame canvas.grab { cursor: grab; }
.frame canvas.cross { cursor: crosshair; }
.colo { position: absolute; top: 12px; left: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 21px; line-height: 1; pointer-events: none; color: var(--text); }
.colo .seal { width: 21px; height: 21px; }
.bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 22px; padding-top: 10px; }
.cap { flex: 1 1 440px; min-width: 0; font-style: italic; color: var(--text2); font-size: 16px; line-height: 1.45; font-variant-numeric: lining-nums tabular-nums; }
.cap .n { font-style: normal; font-weight: 600; color: var(--text); margin-right: .35em; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.seg { display: inline-flex; }
.seg button + button { margin-left: -1px; }
button.b {
  font: inherit; font-size: 15.5px; line-height: 1.2; color: var(--text2);
  background: transparent; border: 1px solid var(--rule); border-radius: 0;
  padding: 5px 12px; cursor: pointer; transition: color .15s ease, background-color .15s ease;
}
button.b:hover { color: var(--text); }
button.b[aria-pressed="true"] { color: var(--accent); background: var(--panel); }
.range { display: inline-flex; align-items: center; gap: 10px; font-size: 15.5px; color: var(--text2); }
.range input { accent-color: var(--accent); width: 150px; }
.range output { font-variant-numeric: tabular-nums; min-width: 9.5em; font-style: italic; }
@media (max-width: 640px) { .range { flex-wrap: wrap; } .range input { width: min(150px, 42vw); } .range output { min-width: 0; } }

/* Bindings and notes */
.cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0 52px; margin-top: 38px; }
.binds { width: 100%; border-collapse: collapse; font-size: 16.5px; line-height: 1.45; }
.binds caption { text-align: left; font-style: italic; color: var(--muted); font-size: 17.5px; padding-bottom: 8px; }
.binds th { text-align: left; font-weight: 400; font-style: italic; color: var(--muted); font-size: 15px; padding: 0 14px 6px 0; border-bottom: 1px solid var(--rule-strong); }
.binds td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; color: var(--text2); }
.binds td:first-child { color: var(--text); width: 36%; }
.notes { display: grid; gap: 26px; align-content: start; }
.notes p { font-size: 17px; line-height: 1.52; color: var(--text2); }
.notes .label { margin-bottom: 4px; }
.sig { margin-top: 56px; }
.sig .prose { margin-bottom: 4px; }

/* Shoals: the Brief */
.brief { padding: 50px 22px 20px; }
.mast { border-top: 3px double var(--rule-strong); border-bottom: 1px solid var(--rule-strong); text-align: center; padding: 8px 0 7px; }
.ears { display: flex; justify-content: space-between; gap: 12px; font-style: italic; color: var(--muted); font-size: 14px; }
.mast-title { font-size: clamp(32px, 5.4vw, 54px); font-weight: 400; line-height: 1.08; letter-spacing: -0.012em; font-variation-settings: 'opsz' 72; margin: 2px 0 6px; }
.dateline { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px 22px; border-top: 1px solid var(--rule); padding-top: 6px; font-size: 14.5px; color: var(--text2); font-variant-numeric: lining-nums tabular-nums; }
.dateline .dn { color: var(--accent); }
.brief-a { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 0 26px; padding-top: 18px; }
.lead { border-right: 1px solid var(--rule); padding-right: 24px; transition: opacity .35s ease; }
.lead .kick { font-style: italic; color: var(--accent); font-size: 15px; }
.lead h3 { font-weight: 400; font-size: clamp(25px, 2.7vw, 32px); line-height: 1.1; margin: 4px 0 10px; text-wrap: balance; }
.lead .body { font-size: 16.5px; line-height: 1.5; color: var(--text2); hyphens: auto; }
.lead .src { font-size: 13.5px; font-style: italic; color: var(--muted); margin-top: 10px; }
.brief canvas { display: block; width: 100%; height: auto; }
#cv-tape { aspect-ratio: 16 / 7; }
#cv-vol { aspect-ratio: 16 / 11; }
.small { font-size: 13.5px; font-style: italic; color: var(--muted); margin-top: 4px; }
.brief-b { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 0 26px; border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 14px; }
.brief-b h4 { font-weight: 600; font-size: 15.5px; margin: 0 0 6px; }
.brief-b h4 span { font-weight: 400; font-style: italic; color: var(--muted); }
.agate { width: 100%; border-collapse: collapse; font-size: 13.5px; line-height: 1.32; font-variant-numeric: lining-nums tabular-nums; }
.agate th { font-weight: 400; font-style: italic; color: var(--muted); text-align: right; padding: 2px 6px 4px; border-bottom: 1px solid var(--rule-strong); }
.agate td { text-align: right; padding: 2px 6px; border-bottom: 1px solid var(--rule); color: var(--text); }
.agate td.k, .agate th.k { text-align: center; font-weight: 600; }
.agate tr.atm td { background: var(--panel); }
.agate .dn { color: var(--accent); }
.agate .ch { color: var(--text2); }

/* Tables for the plan */
.plan { width: 100%; border-collapse: collapse; font-size: 16.5px; line-height: 1.45; margin-top: 26px; }
.plan th { text-align: left; font-weight: 400; font-style: italic; color: var(--muted); font-size: 15px; padding: 0 16px 6px 0; border-bottom: 1px solid var(--rule-strong); }
.plan td { padding: 9px 16px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; color: var(--text2); }
.plan td:first-child { color: var(--text); white-space: nowrap; }
.plan code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: .86em; }
.tablewrap { overflow-x: auto; }
ol.steps { padding-left: 1.3em; margin: 26px 0 0; display: grid; gap: 14px; max-width: 760px; }
ol.steps li { padding-left: .3em; font-size: 18px; line-height: 1.52; color: var(--text2); }
ol.steps li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
ol.steps strong { color: var(--text); font-weight: 600; }
.qs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 44px; margin-top: 22px; }
.qs > div { border-top: 1px solid var(--rule); padding: 14px 0 18px; }
.qs h3 { font-size: 19px; }
.qs p { font-size: 17px; line-height: 1.52; color: var(--text2); }
footer { margin-top: 72px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 15.5px; color: var(--muted); font-style: italic; max-width: 760px; }

@media (max-width: 900px) {
  .now { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols, .split, .qs { grid-template-columns: minmax(0, 1fr); }
  .cols { gap: 34px; }
  .rules { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .brief-a, .brief-b { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .lead { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 16px; }
}
@media (max-width: 640px) {
  body { font-size: 18px; }
  .frame canvas { aspect-ratio: 4 / 3.4; }
  .frame canvas.tall { aspect-ratio: 3 / 4; }
  .now { grid-template-columns: minmax(0, 1fr); }
  .colo { font-size: 18px; top: 10px; left: 11px; }
  .brief { padding: 44px 12px 16px; }
  .plan td:first-child { white-space: normal; }
  section { padding-top: 44px; }
  section + section { margin-top: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
